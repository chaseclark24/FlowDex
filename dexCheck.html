<head>
<link rel="stylesheet" type="text/css" href="style.css">
</head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/js/bootstrap.min.js"></script>

<script>
var path = window.location.href;
var teamID = path.split("?")[1]
divName=1
const api = url => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url)
Promise.all([
    fetch(api('https://api-web.nhle.com/v1/roster/'+teamID+'/current')).then(response => response.json()),
    fetch(api('https://api-web.nhle.com/v1/club-stats/'+teamID+'/now')).then(response => response.json())
]).then(([roster, clubStats]) => {
      const teams = [...roster.forwards, ...roster.defensemen, ...roster.goalies]
      const playerStats = [...clubStats.skaters, ...clubStats.goalies]
      for(team of teams) {
		 const {id, sweaterNumber, firstName, lastName, positionCode, heightInInches, weightInPounds, birthDate, birthCountry} = team;
		 const fullName = firstName.default + ' ' + lastName.default
		 const birth = new Date(birthDate + 'T00:00:00')
		 const today = new Date()
		 const currentAge = today.getFullYear() - birth.getFullYear() - (today < new Date(today.getFullYear(), birth.getMonth(), birth.getDate()) ? 1 : 0)
		 const height = Math.floor(heightInInches / 12) + "' " + (heightInInches % 12) + '"'
		 const weight = weightInPounds + ' lb'
		 const people = playerStats.find(player => player.playerId === id) || {}
		 div = document.createElement("div");
		 div.innerHTML='<a class="list-group-item" data-toggle="collapse" data-target="#'+divName+'" >' + fullName + ' <span class="label label-default" >#' + (sweaterNumber ?? '—') + '</span></a>'
               			div.innerHTML=div.innerHTML 
               				+'<div id="'+divName+'" class="collapse"><div class="row"><div class="col-xs-6"><p class="list-group-item small"><span class="playerRow">' 
               				+'<b>Age </b>' +currentAge 
               				+'</span></p><p class="list-group-item small"><span class="playerRow">' 
               				+'<b>Height </b>' + height 
               				+'</span></p><p class="list-group-item small"><span class="playerRow">' 
               				+'<b>Weight </b>' + weight 
               				+'</span></p><p class="list-group-item small"><span class="playerRow">' 
					+'<b>Nationality </b>'+ birthCountry
               				+'</span></p><p class="list-group-item small"><span class="playerRow">' 
					+'<b>Position </b>' + positionCode
               				+'</span></p></div><div class="col-xs-6"><p class="list-group-item small"><span class="playerRow">' 
					+'<b>Goals </b>' + (people.goals ?? 0)
               				+'</span></p><p class="list-group-item small"><span class="playerRow">'
					+'<b>Points </b>' + (people.points ?? 0)
               				+'</span></p><p class="list-group-item small"><span class="playerRow">' 
					+'<b>Assists </b>' + (people.assists ?? 0)
               				+'</span></p><p class="list-group-item small"><span class="playerRow">' 
					+'<b>Penalty Minutes </b>' + (people.penaltyMinutes ?? 0)
               				+'</span></p><p class="list-group-item small"><span class="playerRow">'
					+'<b>Shots </b>' + (people.shots ?? people.shotsAgainst ?? 0)
               				+'</span></p></span></div></div></div></container>'
       
               			document.getElementById("main").appendChild(div);
               			divName=divName+1
      }
});
</script>







<body>
<div class="panel list-group">
	<div id ="main" class="main">

	</div>
</div>
