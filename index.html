<head>
<link rel="stylesheet" type="text/css" href="style.css">
</head>
<!-- Latest compiled and minified CSS -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/js/bootstrap.min.js"></script>
<script>
divName=1
const api = url => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url)
//request data for team listing
fetch(api('https://api-web.nhle.com/v1/standings/now'))
.then(response => {
    return response.json().then(data => data.standings);
}).then(teams => {
      for(team of teams) {
		const {teamAbbrev, teamName, wins, losses} = team
		const id = teamAbbrev.default
		const name = teamName.default
		var teamList2 = document.getElementById("teamList");
		teamList2.style.display='block';
		div = document.createElement("div");
		url = "./dexCheck.html?" + id
		div.innerHTML='<div id = "'+divName+'"><a href='+url+' class="list-group-item">' + name +'<span class="label label-default"> L:'+losses + '</span><span align="right" class="label label-default"> W:' + wins+ '</span></span></a></div>'
		document.getElementById("teamList").appendChild(div);
		divName=divName+1


      }
});
	



</script>





<div class="panel list-group">
	<div id ="teamList" class="teamList">
</div>
